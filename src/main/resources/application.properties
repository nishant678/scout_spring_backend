spring.application.name=scout-management

# PostgreSQL - Render (override via env vars)
spring.datasource.url=jdbc:postgresql://dpg-d8jef8j7uimc73bkpc9g-a.singapore-postgres.render.com:5432/scout_db_68kx?sslmode=require
spring.datasource.username=scout_db_68kx_user
spring.datasource.password=o0zJhSCmfgLfRzKC1wVBkNq3O1C0dcDY
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Server - Render assigns PORT via env variable
server.port=${PORT:8080}

# JWT
app.jwt.secret=${JWT_SECRET:my-super-secret-key-for-scout-management-jwt-tokens-2026}
app.jwt.expiration=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true

# CORS - allow frontend origins (comma-separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
